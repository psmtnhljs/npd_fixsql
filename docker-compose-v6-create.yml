services:
  postgres:
    image: postgres:16-alpine
    container_name: nodepassdash-postgres-v6-create
    environment:
      POSTGRES_DB: nodepassdash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data-v6-create:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodepassdash"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      app_net:
        ipv6_address: fd00::20

  nodepassdash:
    image: ghcr.io/nodepassproject/nodepassdash:latest
    container_name: nodepassdash
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nodepassdash?sslmode=disable&TimeZone=Asia%2FShanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      app_net:
        ipv6_address: fd00::10

networks:
  app_net:
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: fd00::/80
          gateway: fd00::1

volumes:
  postgres-data-v6-create:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodepassdash
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nodepassdash}
      POSTGRES_DB: nodepassdash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodepassdash"]
      interval: 10s
      timeout: 5s
      retries: 5

  nodepassdash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodepassdash
    ports:
      - "4000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nodepassdash
      DB_PASSWORD: ${DB_PASSWORD:-nodepassdash}
      DB_NAME: nodepassdash
      DB_SSLMODE: disable
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: nodepassdash-postgres-dev
    environment:
      POSTGRES_DB: nodepassdash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodepassdash"]
      interval: 10s
      timeout: 5s
      retries: 10

  nodepassdash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodepassdash
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nodepassdash?sslmode=disable&TimeZone=Asia%2FShanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data-dev:

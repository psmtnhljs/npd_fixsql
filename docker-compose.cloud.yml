services:
  postgres:
    image: postgres:16-alpine
    container_name: npd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodepassdash}
      POSTGRES_USER: ${POSTGRES_USER:-nodepass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodepass} -d ${POSTGRES_DB:-nodepassdash}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nodepassdash:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    container_name: npd-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      LOG-LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-nodepass}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DB_NAME: ${POSTGRES_DB:-nodepassdash}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Shanghai}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
